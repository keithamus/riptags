[package]
name = "riptags"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Fast tree-sitter symbol search: definitions and cross-references across a codebase"
repository = "https://github.com/keithamus/riptags"
license = "MIT"

[lib]
name = "riptags"
path = "src/lib.rs"

[[bin]]
name = "rt"
path = "src/main.rs"

[dependencies]
anstyle = "1.0.14"
anstyle-query = "1.1.5"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ignore = "0.4.33"
memchr = "2.8.3"
memmap2 = "0.9.9"
notify = "8.2.0"
rayon = { version = "1.12.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tree-sitter = "0.27.0"
tree-sitter-bash = { version = "0.25.1", optional = true }
tree-sitter-c = { version = "0.24.2", optional = true }
tree-sitter-c-sharp = { version = "0.23.5", optional = true }
tree-sitter-cpp = { version = "0.23.4", optional = true }
tree-sitter-css = { version = "0.25.0", optional = true }
tree-sitter-elixir = { version = "0.3.5", optional = true }
tree-sitter-go = { version = "0.25.0", optional = true }
tree-sitter-haskell = { version = "0.23.1", optional = true }
tree-sitter-html = { version = "0.23.2", optional = true }
tree-sitter-java = { version = "0.23.5", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-kotlin-ng = { version = "1.1.0", optional = true }
tree-sitter-lua = { version = "0.5.0", optional = true }
tree-sitter-nix = { version = "0.3.0", optional = true }
tree-sitter-ocaml = { version = "0.26.0", optional = true }
tree-sitter-php = { version = "0.24.2", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-ruby = { version = "0.23.1", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-scala = { version = "0.26.2", optional = true }
tree-sitter-swift = { version = "0.7.3", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }
tree-sitter-zig = { version = "1.1.2", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[features]
default = [
  "bash",
  "c",
  "cpp",
  "csharp",
  "css",
  "elixir",
  "go",
  "haskell",
  "html",
  "java",
  "javascript",
  "kotlin",
  "lua",
  "nix",
  "ocaml",
  "php",
  "python",
  "rayon",
  "ruby",
  "rust",
  "scala",
  "swift",
  "tsx",
  "typescript",
  "zig",
]
bash = ["dep:tree-sitter-bash"]
c = ["dep:tree-sitter-c"]
cpp = ["dep:tree-sitter-cpp"]
csharp = ["dep:tree-sitter-c-sharp"]
css = ["dep:tree-sitter-css"]
elixir = ["dep:tree-sitter-elixir"]
go = ["dep:tree-sitter-go"]
haskell = ["dep:tree-sitter-haskell"]
html = ["dep:tree-sitter-html"]
java = ["dep:tree-sitter-java"]
javascript = ["dep:tree-sitter-javascript"]
kotlin = ["dep:tree-sitter-kotlin-ng"]
lua = ["dep:tree-sitter-lua"]
nix = ["dep:tree-sitter-nix"]
ocaml = ["dep:tree-sitter-ocaml"]
php = ["dep:tree-sitter-php"]
python = ["dep:tree-sitter-python"]
rayon = ["dep:rayon"]
ruby = ["dep:tree-sitter-ruby"]
rust = ["dep:tree-sitter-rust"]
scala = ["dep:tree-sitter-scala"]
swift = ["dep:tree-sitter-swift"]
tsx = ["dep:tree-sitter-typescript"]
typescript = ["dep:tree-sitter-typescript"]
zig = ["dep:tree-sitter-zig"]

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
